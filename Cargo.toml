[package]
name = "logicenter"
version = "1.0.0"
edition = "2024"
description = "Logi Center — a GTK4 device manager for Logitech peripherals"
license = "GPL-2.0-or-later"
authors = ["Christos A. Daggas <info@chrisdaggas.com>"]
homepage = "https://chrisdaggas.com"
repository = "https://github.com/christosdaggas/Logi-Center"

[dependencies]
anyhow = "1"
env_logger = "0.11"
glib = "0.22"
gtk4 = "0.11"
libadwaita = { version = "0.9", features = ["v1_6"] }
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
